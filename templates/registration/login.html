{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Welcome back 👋</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="create-btn">
        Log In
    </button>

</form>

<p>
Don't have an account?
<a href="{% url 'signup' %}">Create one</a>
</p>

{% endblock %}
