{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}

<h1>Create your Anonymous Life account</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="create-btn">
        Create Account
    </button>

</form>

<p>
Already have an account?
<a href="{% url 'login' %}">Log in</a>
</p>

{% endblock %}
