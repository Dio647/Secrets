{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Anonymous Life
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>


<body>

<header class="navbar">

    <div class="logo">
        🕊️ Anonymous Life
    </div>


    <nav>

        <a href="{% url 'home' %}">
            Home
        </a>


        <a href="{% url 'create_post' %}">
            Create Post
        </a>


        <a href="{% url 'categories' %}">
            Categories
        </a>


        <a href="#">
            About
        </a>


        {% if user.is_authenticated %}

            <span>
                👋 {{ user.username }}
            </span>


            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">
                    Logout
                </button>
            </form>


        {% else %}


            <a href="{% url 'login' %}">
                Login
            </a>


            <a href="{% url 'signup' %}">
                Sign Up
            </a>


        {% endif %}


    </nav>

</header>



<main class="container">

    {% block content %}
    {% endblock %}

</main>



</body>

</html>
